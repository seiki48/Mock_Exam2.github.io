        const useSRS = () => {
            const load = () => JSON.parse(localStorage.getItem('gen1402_srs_v3') || '{}');
            const save = (data) => localStorage.setItem('gen1402_srs_v3', JSON.stringify(data));
            
            const update = (qId, isCorrect, timeSpent) => {
                constdb = load();
                let item =db[qId] || { ease: 2.5, interval: 0, reviews: 0, correct: 0, lapses: 0 };
                const bonus = timeSpent < 5000 ? 0.15 : 0;

                if (!isCorrect) { 
                    item.interval = 0; item.ease = Math.max(1.3, item.ease - 0.2); item.lapses++;
                } else {
                    item.correct++;
                    if (item.reviews === 0) item.interval = 1;
                    else if (item.reviews === 1) item.interval = 3;
                    else item.interval = Math.ceil(item.interval * (item.ease + bonus));
                    item.ease += 0.1;
                }
                item.dueDate =date.now() + (item.interval * 24 * 60 * 60 * 1000); 
                item.reviews++;
               db[qId] = item;
                save(db);
            };

            const getStats = () => {
                constdb = load();
                const totalCards = QUESTION_POOL.length;
                const learnedCards = Object.keys(db).length;
                let mature = 0, young = 0, totalReviews = 0, totalCorrect = 0;
                let forecast = [0, 0, 0, 0, 0];
                const now =date.now();

                Object.values(db).forEach(item => {
                    if (item.interval > 21) mature++; else young++;
                    totalReviews += item.reviews; totalCorrect += item.correct;
                    constdays = Math.ceil((item.dueDate - now) / 86400000);
                    if (days >= 0 &&days < 5) forecast[days]++;
                });

                return {
                    newCards: totalCards - learnedCards, young, mature,
                    retention: totalReviews === 0 ? 0 : Math.round((totalCorrect/totalReviews)*100),
                    totalReviews, forecast
                };
            };

            const getDue = () => {
                constdb = load();
                return Object.keys(db).filter(id =>db[id].dueDate <=date.now()).map(Number);
            };

            return { update, getDue, getStats };
        };

        // ==========================================
        // 3. COMPONENTS
        // ==========================================

        const StatsDashboard = ({ stats, onReview,dueCount, onClose }) => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-3xl p-6 w-full max-w-4xl shadow-2xl anim-fade max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-indigo-800">📊 สถิติการจำ (Anki Style)</h2>
                        <button onClick={onClose} className="text-gray-500 hover:text-red-500 text-xl">✕</button>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/*donut Chart */}
                        <div className="col-span-1 bg-gray-50 p-4 rounded-2xl flex flex-col items-center">
                            <div className="relative w-40 h-40 mb-4 rounded-full" style={{background: `conic-gradient(#4ade80 0% ${stats.mature/(stats.newCards+stats.young+stats.mature)*100}%, #60a5fa 0% ${(stats.mature+stats.young)/(stats.newCards+stats.young+stats.mature)*100}%, #e2e8f0 0% 100%)`}}>
                                <div className="absolute inset-0 m-auto w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow-inner">
                                    <span className="text-2xl font-bold">{stats.newCards+stats.young+stats.mature}</span>
                                    <span className="text-[10px] text-gray-400">TOTAL</span>
                                </div>
                            </div>
                            <div className="w-full text-sm space-y-1">
                                <div className="flex justify-between"><span className="text-green-500">● Mature</span> <b>{stats.mature}</b></div>
                                <div className="flex justify-between"><span className="text-blue-500">● Learning</span> <b>{stats.young}</b></div>
                                <div className="flex justify-between"><span className="text-gray-400">● New</span> <b>{stats.newCards}</b></div>
                            </div>
                        </div>
                        {/* Retention & Forecast */}
                        <div className="col-span-1 md:col-span-2 space-y-4">
                            <div className="bg-indigo-50 p-4 rounded-2xl flex justify-between items-center">
                                <div><div className="text-gray-500 text-sm">Retention Rate</div><div className="text-3xl font-black text-indigo-600">{stats.retention}%</div></div>
                                <div><div className="text-gray-500 text-sm">Total Reviews</div><div className="text-xl font-bold text-gray-700">{stats.totalReviews}</div></div>
                            </div>
                            <div className="bg-white border p-4 rounded-2xl h-40 flex flex-col">
                                <div className="text-xs text-gray-500 mb-2 uppercase">5-Day Forecast</div>
                                <div className="flex items-end justify-between flex-1 gap-2">
                                    {stats.forecast.map((v, i) => (
                                        <div key={i} className="flex-1 bg-indigo-100 rounded-t relative group h-full flex items-end">
                                            <div className="w-full bg-indigo-500 rounded-t transition-all" style={{height: `${Math.max(v/Math.max(...stats.forecast,1)*100, 5)}%`}}></div>
                                            <div className="absolute -top-6 w-full text-center text-xs font-bold opacity-0 group-hover:opacity-100">{v}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-between text-[10px] text-gray-400 mt-1">
                                    <span>Today</span><span>+4d</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onClick={onReview}disabled={dueCount===0} className={`w-full py-3 rounded-xl font-bold text-white shadow-lg ${dueCount>0?'bg-green-500 hover:bg-green-600':'bg-gray-300'}`}>
                        {dueCount > 0 ? `เริ่มทบทวน (${dueCount} ข้อ)` : 'ไม่มีข้อที่ต้องทบทวนวันนี้'}
                    </button>
                </div>
            </div>
        );

        const Menu = ({ onSelectMode }) => {
            const srs = useSRS();
            constdueCount = srs.getDue().length;
            const [showStats, setShowStats] = useState(false);

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-indigo-900 text-white">
                    {showStats && <StatsDashboard stats={srs.getStats()}dueCount={dueCount} onReview={() => { setShowStats(false); onSelectMode('review_srs'); }} onClose={() => setShowStats(false)} />}
                    
                    <div className="max-w-5xl w-full z-10 text-center">
                        <h1 className="text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-purple-200">GEN1402 PRO</h1>
                        <p className="text-indigo-200 mb-10">Exam Simulator Ultimate (Fulldata)</p>

                        <div className="grid md:grid-cols-3 gap-6 text-left">
                            {/* Practice */}
                            <div className="bg-white/10 backdrop-blur border border-white/20 rounded-3xl p-6 hover:bg-white/15 transition">
                                <div className="text-4xl mb-4">📚</div>
                                <h3 className="text-xl font-bold mb-2">โหมดฝึกฝน</h3>
                                <p className="text-sm text-indigo-200 mb-4">ทำข้อสอบพร้อมเฉลย (เรียงข้อ)</p>
                                
                                {/* ปุ่มฝึกฝนทั้งหมด ที่เคยหายไป ใส่คืนแล้วตรงนี้ */}
                                <button onClick={() => onSelectMode('practice_all')} className="w-full mb-3 py-2 bg-indigo-500 hover:bg-indigo-400 text-white rounded-xl font-bold shadow-lg transition">
                                    ตะลุยโจทย์ทั้งหมด (330+ ข้อ)
                                </button>
                                
                                <div className="grid grid-cols-5 gap-1">
                                    {[5,6,7,8,9].map(c => (
                                        <button key={c} onClick={() => onSelectMode('practice_chapter', c)} className="py-1 bg-white/10 hover:bg-white/30 rounded text-xs font-bold transition">บท {c}</button>
                                    ))}
                                </div>
                            </div>

                            {/* SRS */}
                            <div className="bg-gradient-to-b from-emerald-500/20 to-teal-900/40 backdrop-blur border border-emerald-500/30 rounded-3xl p-6 relative">
                                <div className="text-4xl mb-4">🧠</div>
                                <h3 className="text-xl font-bold mb-2 text-emerald-100">ระบบทบทวน</h3>
                                <div className="text-3xl font-bold mb-4">{dueCount} <span className="text-sm font-normal text-emerald-200">ข้อที่ต้องทำ</span></div>
                                <button onClick={() => setShowStats(true)} className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold shadow-lg mb-2">ดูสถิติ (Anki Stats)</button>
                            </div>

                            {/* Exam */}
                            <div className="bg-white/10 backdrop-blur border border-white/20 rounded-3xl p-6 hover:bg-white/15 transition">
                                <div className="text-4xl mb-4">⏰</div>
                                <h3 className="text-xl font-bold mb-2">สอบเสมือนจริง</h3>
                                <p className="text-sm text-indigo-200 mb-4">จับเวลา 90 นาที / สุ่มตามสัดส่วนจริง</p>
                                <button onClick={() => onSelectMode('exam_normal')} className="w-full py-2 mb-2 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold shadow-lg">สอบปกติ</button>
                                <button onClick={() => onSelectMode('exam_serious')} className="w-full py-2 bg-gray-800 hover:bg-gray-900 border border-gray-600 text-white rounded-xl font-bold">🛡️ สอบจริงจัง</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Exam = ({ mode, questions, onFinish, onQuit }) => {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(mode.includes('exam') ? 90 * 60 : null);
            const [showHint, setShowHint] = useState(false);
            const [warningCount, setWarningCount] = useState(0);
            const lastActive = useRef(Date.now());
            const isMonitoring = useRef(false);

            const isPractice = mode.includes('practice') || mode === 'review_srs';
            const isSerious = mode === 'exam_serious';

            useEffect(() => {
                const timer = timeLeft !== null && setInterval(() => {
                    setTimeLeft(prev => { if(prev<=1) { clearInterval(timer); finish(false); return 0; } return prev-1; });
                }, 1000);
                if(isSerious) setTimeout(() => isMonitoring.current = true, 3000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                if(!isSerious) return;
                const warn = () => {
                    if(!isMonitoring.current) return;
                    isMonitoring.current = false;
                    setWarningCount(c => {
                        const next = c+1;
                        Swal.fire({ title: 'ผิดกฎ!', text: `เตือนครั้งที่ ${next}/3`, icon: 'warning' }).then(() => {
                            if(next>=3) finish(true); else isMonitoring.current = true;
                        });
                        return next;
                    });
                };
                const handleVis = () =>document.hidden && warn();
                const handleBlur = () => warn();
               document.addEventListener('visibilitychange', handleVis);
                window.addEventListener('blur', handleBlur);
                return () => {document.removeEventListener('visibilitychange', handleVis); window.removeEventListener('blur', handleBlur); };
            }, [isSerious]);

            const handleAnswer = (optIdx) => {
                setAnswers(p => ({ ...p, [currentIdx]: { ans: optIdx, time:date.now()-lastActive.current } }));
                lastActive.current =date.now();
            };

            const finish = (force) => {
                if(force) onFinish(answers, true);
                else Swal.fire({ title: 'ส่งคำตอบ?', icon: 'question', showCancelButton: true }).then(r => r.isConfirmed && onFinish(answers, false));
            };

            const q = questions[currentIdx];
            if(!q) return <div>Loading...</div>;

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-inter">
                    <div className="bg-white shadow sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
                        <button onClick={onQuit} className="text-gray-500 font-bold">ออก</button>
                        <div className="text-center font-bold">
                            {isSerious ? <span className="text-red-600">🛡️ Proctored ({warningCount}/3)</span> : isPractice ? 'Practice' : 'Exam'}
                        </div>
                        <div className={`font-mono font-bold ${timeLeft<300?'text-red-500':''}`}>
                            {timeLeft ? `${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}` : ''}
                        </div>
                    </div>
                    <div className="h-1 bg-gray-200"><div className="h-full bg-green-500 transition-all" style={{width: `${(currentIdx+1)/questions.length*100}%`}}></div></div>
                    
                    <div className="flex-1 max-w-3xl mx-auto w-full p-4">
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-200 anim-fade">
                            <div className="flex justify-between mb-4">
                                <span className="bg-gray-100 px-2 py-1 rounded text-xs font-bold text-gray-600">ข้อ {currentIdx+1}/{questions.length}</span>
                                <span className="text-xs font-bold text-gray-400">บทที่ {q.ch}</span>
                            </div>
                            <h2 className="text-xl font-bold text-gray-800 mb-6 font-sarabun">{q.q}</h2>
                            <div className="space-y-3 font-sarabun">
                                {q.opts.map((opt, i) => (
                                    <button key={i} onClick={() => !answers[currentIdx] && handleAnswer(i)}disabled={isPractice && answers[currentIdx]}
                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all ${
                                            isPractice && answers[currentIdx] ? 
                                                (i===q.a ? 'bg-green-100 border-green-500 text-green-900' : (i===answers[currentIdx].ans ? 'bg-red-100 border-red-500' : 'opacity-50')) :
                                                (answers[currentIdx]?.ans===i ? 'bg-indigo-100 border-indigo-500' : 'hover:border-indigo-300')
                                        }`}>
                                        {opt}
                                    </button>
                                ))}
                            </div>
                            {isPractice && (
                                <div className="mt-4 space-y-3">
                                    {!answers[currentIdx] && <button onClick={()=>setShowHint(!showHint)} className="text-orange-500 text-sm font-bold">💡 คำใบ้</button>}
                                    {showHint && !answers[currentIdx] && <div className="bg-orange-50 p-3 rounded text-sm text-orange-800">{q.hint}</div>}
                                    {answers[currentIdx] && <div className="bg-blue-50 p-4 rounded text-sm text-blue-900"><b>เฉลย:</b> {q.desc}</div>}
                                </div>
                            )}
                        </div>
                        <div className="flex justify-between mt-6">
                            <button onClick={()=>setCurrentIdx(c=>Math.max(0,c-1))}disabled={currentIdx===0} className="px-6 py-2 bg-white rounded shadowdisabled:opacity-50">← ก่อนหน้า</button>
                            {currentIdx===questions.length-1 ? 
                                <button onClick={()=>finish(false)} className="px-6 py-2 bg-indigo-600 text-white rounded shadow">ส่งคำตอบ</button> :
                                <button onClick={()=>setCurrentIdx(c=>Math.min(questions.length-1,c+1))} className="px-6 py-2 bg-white rounded shadow text-indigo-600">ถัดไป →</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ questions, answers, onHome, isCheated }) => {
            const score = questions.reduce((acc, q, i) => acc + (answers[i]?.ans === q.a ? 1 : 0), 0);
            const srs = useSRS();
            useEffect(() => {
                questions.forEach((q, i) => answers[i] && srs.update(q.id, answers[i].ans===q.a, answers[i].time));
            }, []);
            
            return (
                <div className="min-h-screen bg-indigo-50 p-6 flex justify-center font-sarabun">
                    <div className="bg-white w-full max-w-4xl rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className={`p-8 text-center text-white ${isCheated?'bg-red-600':'bg-indigo-600'}`}>
                            <h2 className="text-3xl font-bold">{isCheated?'ถูกปรับตก':'ผลสอบ'}</h2>
                            <div className="text-6xl font-black my-4">{Math.round(score/questions.length*100)}%</div>
                            <p>ได้ {score} / {questions.length} คะแนน</p>
                        </div>
                        <div className="p-4 bg-gray-50 text-center border-b">
                            <button onClick={() => window.location.reload()} className="px-8 py-2 bg-white border rounded shadow hover:bg-gray-100">กลับหน้าหลัก</button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 space-y-4">
                            {questions.map((q, i) => (
                                <div key={i} className={`p-4 rounded border-l-4 shadow-sm ${answers[i]?.ans===q.a?'border-green-500 bg-green-50':'border-red-500 bg-red-50'}`}>
                                    <div className="font-bold mb-1">{i+1}. {q.q}</div>
                                    <div className="text-sm">ตอบ: {answers[i]?q.opts[answers[i].ans]:'-'} | เฉลย: {q.opts[q.a]}</div>
                                    <div className="text-xs text-gray-500 mt-1">{q.desc}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = useState('menu');
            const [activeQ, setActiveQ] = useState([]);
            const [mode, setMode] = useState('');
            const [res, setRes] = useState(null);

            const start = (m, param) => {
                setMode(m);
                let qSet = [];
                if (m === 'practice_all') {
                    // แก้ไข: เรียงตามบท และ ID (ไม่สุ่มมั่ว)
                    qSet = [...QUESTION_POOL].sort((a,b) => a.ch - b.ch || a.id - b.id);
                } else if (m === 'practice_chapter') {
                    qSet = QUESTION_POOL.filter(q => q.ch === param);
                } else if (m === 'review_srs') {
                    const srs = JSON.parse(localStorage.getItem('gen1402_srs_v3') || '{}');
                    constdueIds = Object.keys(srs).filter(id => srs[id].dueDate <=date.now()).map(Number);
                    qSet = QUESTION_POOL.filter(q =>dueIds.includes(q.id));
                } else if (m.includes('exam')) {
                    // แก้ไข: สุ่มตาม Blueprint แต่เรียงข้อสอบตามบท (Part 5 -> 6 -> 7...)
                    let parts = [];
                    [5,6,7,8,9].forEach(ch => {
                        const pool = QUESTION_POOL.filter(q => q.ch === ch);
                        const count = EXAM_BLUEPRINT[ch];
                        const picked = pool.sort(() => 0.5 - Math.random()).slice(0, count);
                        parts.push(...picked);
                    });
                    qSet = parts; // ไม่ Shuffle qSet ซ้ำ เพื่อให้ข้อสอบเรียงเป็น Part
                }
                
                if(qSet.length===0) return Swal.fire('ไม่พบข้อสอบ', '', 'info');
                setActiveQ(qSet);
                setPage('exam');
            };

            return (
                <>
                    {page==='menu' && <Menu onSelectMode={start} />}
                    {page==='exam' && <Exam mode={mode} questions={activeQ} onFinish={(a,c)=>{setRes({a,c}); setPage('result');}} onQuit={()=>setPage('menu')} />}
                    {page==='result' && <Result questions={activeQ} answers={res.a} isCheated={res.c} onHome={()=>setPage('menu')} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
