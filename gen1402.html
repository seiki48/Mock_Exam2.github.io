        ];

        // ==========================================
        // 2. ระบบ SRS (Memory)
        // ==========================================
        const useSRS = () => {
            const load = () => JSON.parse(localStorage.getItem('gen1402_srs') || '{}');
            const save = (data) => localStorage.setItem('gen1402_srs', JSON.stringify(data));
            
            const update = (qId, isCorrect, timeSpent) => {
                const db = load();
                let item = db[qId] || { ease: 2.5, interval: 0, reviews: 0 };
                
                if (!isCorrect || timeSpent > 30000) { 
                    item.interval = 0; 
                    item.ease = Math.max(1.3, item.ease - 0.2);
                } else {
                    item.interval = item.reviews === 0 ? 1 : Math.ceil(item.interval * item.ease);
                    item.ease += 0.1;
                }
                item.dueDate = Date.now() + (item.interval * 60000); 
                item.reviews++;
                db[qId] = item;
                save(db);
            };

            const getDue = () => {
                const db = load();
                const now = Date.now();
                return Object.keys(db).filter(id => db[id].dueDate <= now).map(Number);
            };
            return { update, getDue };
        };

        // ==========================================
        // 3. UI COMPONENTS
        // ==========================================

                                <p className="text-sm text-gray-500 mb-4">ทำข้อสอบพร้อมเฉลยและคำใบ้</p>

                                        ))}

                                    {dueCount > 0 && (

                                            ทบทวน {dueCount} ข้อที่ลืม
                                        </button>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white text-gray-800 rounded-2xl p-6 shadow hover:shadow-xl transition transform hover:-translate-y-1 border-2 border-transparent hover:border-red-500">
                                <div className="text-4xl mb-4">⏰</div>
                                <h3 className="text-xl font-bold mb-2">สอบเสมือนจริง</h3>
                                <p className="text-sm text-gray-500 mb-4">110 ข้อ / 90 นาที</p>
                                <button onClick={() => onSelectMode('exam_normal')} className="w-full py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-lg">
                                    เริ่มสอบ (Normal)
                                </button>
                            </div>

                            <div className="bg-gray-900 text-white rounded-2xl p-6 shadow hover:shadow-xl transition transform hover:-translate-y-1 border border-gray-700">
                                <div className="text-4xl mb-4">🛡️</div>
                                <h3 className="text-xl font-bold mb-2">สอบจริงจัง</h3>
                                <p className="text-sm text-gray-400 mb-4">Anti-Cheat: ตรวจสลับจอ + AFK</p>
                                <button onClick={() => onSelectMode('exam_serious')} className="w-full py-3 bg-yellow-500 text-black rounded-xl font-bold hover:bg-yellow-400 shadow-lg">
                                    เริ่มสอบ (Proctored)

        const Exam = ({ mode, questions, onFinish, onQuit }) => {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(mode.includes('exam') ? 90 * 60 : null);
            const [showHint, setShowHint] = useState(false);
            
            // Security Vars
            const [warningCount, setWarningCount] = useState(0);
            const lastActive = useRef(Date.now());
            const isMonitoring = useRef(false); // Flag เพื่อบอกว่าเริ่มจับโกงหรือยัง
            const isCheckingAFK = useRef(false); // Flag เพื่อบอกว่า Popup AFK เด้งอยู่ไหม

            const isPractice = mode.includes('practice') || mode === 'review_srs';
            const isSerious = mode === 'exam_serious';

            // 1. Timer Start Logic (Warm-up)
            useEffect(() => {
                // Timer
                let timer;
                if (timeLeft !== null) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) { clearInterval(timer); finish(); return 0; }
                            return prev - 1;
                        });
                    }, 1000);
                }

                // Security Warm-up (รอ 3 วินาทีก่อนเริ่มจับ เพื่อแก้บัค 3/3 ทันที)
                if (isSerious) {
                    setTimeout(() => {
                        isMonitoring.current = true;
                        lastActive.current = Date.now();
                        console.log("Security System: ARMED");
                    }, 3000);
                }

                return () => clearInterval(timer);
            }, []);

            // 2. Anti-Cheat Logic (Improved)
            useEffect(() => {
                if (!isSerious) return;

                const triggerWarning = (msg) => {
                    // ถ้ายังไม่เริ่มจับ หรือ Popup AFK เด้งอยู่ อย่าเพิ่งนับ
                    if (!isMonitoring.current || isCheckingAFK.current) return;

                    // ป้องกันการเรียกซ้ำ
                    isMonitoring.current = false; // หยุดจับชั่วคราวตอน Alert
                    
                    const newCount = warningCount + 1;
                    setWarningCount(newCount);

                    Swal.fire({
                        icon: 'warning',
                        title: 'ผิดกฎการสอบ!',
                        text: `${msg} (เตือนครั้งที่ ${newCount}/3)`,
                        confirmButtonText: 'รับทราบ',
                        allowOutsideClick: false
                    }).then(() => {
                        if (newCount >= 3) {
                            finish(true);
                        } else {
                            isMonitoring.current = true; // เริ่มจับต่อ
                            lastActive.current = Date.now();
                        }
                    });
                };

                const handleVisibility = () => {
                    if (document.hidden) triggerWarning("ห้ามพับหน้าจอหรือสลับแท็บ!");
                };
                
                const handleBlur = () => {
                    triggerWarning("กรุณาอย่าคลิกนอกหน้าต่างสอบ!");
                };
                
                // AFK Check with Pre-warning
                const checkAFKInterval = setInterval(() => {
                    if (!isMonitoring.current || isCheckingAFK.current) return;

                    const idleTime = Date.now() - lastActive.current;
                    const AFK_THRESHOLD = 45000; // 45 วินาทีเตือน (สำหรับทดสอบ) - ปกติอาจใช้ 5 นาที

                    if (idleTime > AFK_THRESHOLD) {
                        isCheckingAFK.current = true; // ล็อคไม่ให้ warning อื่นแทรก
                        
                        let timerInterval;
                        Swal.fire({
                            title: 'คุณยังอยู่ไหม?',
                            html: 'ระบบไม่พบการเคลื่อนไหว จะปรับฟาวล์ใน <b></b> วินาที',
                            timer: 10000, // นับถอยหลัง 10 วิ
                            timerProgressBar: true,
                            icon: 'question',
                            showCancelButton: false,
                            confirmButtonText: 'ยังอยู่ครับ/ค่ะ!',
                            allowOutsideClick: false,
                            didOpen: () => {
                                const b = Swal.getHtmlContainer().querySelector('b');
                                timerInterval = setInterval(() => {
                                    if(b) b.textContent = Math.ceil(Swal.getTimerLeft() / 1000);
                                }, 100);
                            },
                            willClose: () => {
                                clearInterval(timerInterval);
                            }
                        }).then((result) => {
                            isCheckingAFK.current = false;
                            if (result.dismiss === Swal.DismissReason.timer) {
                                // หมดเวลา -> เตือนจริง
                                isMonitoring.current = true; // เปิดให้ triggerWarning ทำงาน
                                triggerWarning("ไม่มีการตอบสนองนานเกินไป (AFK)");
                            } else {
                                // กดปุ่ม -> รีเซ็ต
                                lastActive.current = Date.now();
                            }
                        });
                    }
                }, 1000);

                const resetActivity = () => {
                    if (!isCheckingAFK.current) {
                        lastActive.current = Date.now();
                    }
                };

                window.addEventListener('blur', handleBlur);
                document.addEventListener('visibilitychange', handleVisibility);
                window.addEventListener('mousemove', resetActivity);
                window.addEventListener('keydown', resetActivity);
                window.addEventListener('click', resetActivity);

                return () => {
                    window.removeEventListener('blur', handleBlur);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    window.removeEventListener('mousemove', resetActivity);
                    window.removeEventListener('keydown', resetActivity);
                    window.removeEventListener('click', resetActivity);
                    clearInterval(checkAFKInterval);
                };
            }, [isSerious, warningCount]);

            const handleAnswer = (optIdx) => {
                const timeSpent = Date.now() - lastActive.current;
                setAnswers(prev => ({ ...prev, [currentIdx]: { ans: optIdx, time: timeSpent } }));
                lastActive.current = Date.now();
            };

            const finish = (force = false) => {
                isMonitoring.current = false; // Stop checking
                if (force) {
                    onFinish(answers, true);
                } else {
                    Swal.fire({
                        title: 'ยืนยันส่งคำตอบ?',
                        text: `ทำไปแล้ว ${Object.keys(answers).length} / ${questions.length} ข้อ`,
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: 'ส่งข้อสอบ',
                        cancelButtonText: 'ทำต่อ'
                    }).then((result) => {
                        if (result.isConfirmed) onFinish(answers, false);
                    });
                }
            };

            const q = questions[currentIdx];
            const answered = answers[currentIdx];

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    {/* Header */}
                    <div className="bg-white shadow-md sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <button onClick={onQuit} className="text-gray-500 hover:text-red-600 font-bold">ออก</button>
                            <div className="font-bold text-lg flex flex-col items-center">
                                <span>{isSerious ? '🛡️ สอบจริงจัง' : isPractice ? 'โหมดฝึกฝน' : 'สอบเก็บคะแนน'}</span>
                                {isSerious && <span className="text-xs text-red-500">Warning: {warningCount}/3</span>}
                            </div>
                            {timeLeft !== null && (
                                <div className={`font-mono text-xl font-bold ${timeLeft < 300 ? 'text-red-500 animate-pulse' : 'text-indigo-600'}`}>
                                    {Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}
                                </div>
                            )}
                        </div>
                        <div className="h-1 bg-gray-200 w-full">
                            <div className="h-full bg-green-500 transition-all duration-300" style={{ width: `${((currentIdx+1)/questions.length)*100}%` }}></div>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div className="flex-1 max-w-3xl w-full mx-auto p-4 md:p-8">
                        <div className="bg-white rounded-3xl shadow-sm border border-gray-200 p-6 md:p-10 anim-fade">
                            <div className="flex justify-between items-start mb-6">
                                <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-lg text-sm font-bold">ข้อที่ {currentIdx + 1} / {questions.length}</span>
                                <span className="text-sm text-gray-400">บทที่ {q.ch}</span>
                            </div>

                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed">{q.q}</h2>

                            <div className="space-y-3">
                                {q.opts.map((opt, i) => {
                                    let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all font-medium ";
                                    if (isPractice && answered) {
                                        if (i === q.a) btnClass += "bg-green-100 border-green-500 text-green-900";
                                        else if (i === answered.ans) btnClass += "bg-red-100 border-red-500 text-red-900";
                                        else btnClass += "border-gray-100 text-gray-400";
                                    } else if (answered?.ans === i) {
                                        btnClass += "bg-indigo-100 border-indigo-500 text-indigo-900";
                                    } else {
                                        btnClass += "border-gray-100 hover:border-indigo-200 hover:bg-gray-50";
                                    }

                                    return (
                                        <button 
                                            key={i} 
                                            onClick={() => !answered && handleAnswer(i)} 
                                            disabled={isPractice && answered}
                                            className={btnClass}
                                        >
                                            {['ก', 'ข', 'ค', 'ง'][i]}. {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Hint & Explanation */}
                            {isPractice && (
                                <div className="mt-6 space-y-4">
                                    {!answered && (
                                        <button 
                                            onClick={() => setShowHint(!showHint)}
                                            className="text-orange-500 text-sm font-bold hover:underline"
                                        >
                                            {showHint ? 'ซ่อนคำใบ้' : '💡 ดูคำใบ้'}
                                        </button>
                                    )}
                                    {showHint && !answered && (
                                        <div className="bg-orange-50 p-3 rounded-lg text-orange-800 text-sm border-l-4 border-orange-400 anim-fade">
                                            {q.hint}
                                        </div>
                                    )}
                                    {answered && (
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 anim-fade">
                                            <h4 className="font-bold text-blue-900 mb-1">เฉลยละเอียด:</h4>
                                            <p className="text-blue-800 text-sm">{q.desc}</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Navigation */}
                        <div className="flex justify-between mt-6">
                            <button 
                                onClick={() => { setCurrentIdx(Math.max(0, currentIdx - 1)); setShowHint(false); }}
                                disabled={currentIdx === 0}
                                className="px-6 py-2 bg-white rounded-lg shadow disabled:opacity-50 font-bold text-gray-600"
                            >
                                ข้อก่อนหน้า
                            </button>
                            {currentIdx === questions.length - 1 ? (
                                <button onClick={() => finish()} className="px-6 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 font-bold">ส่งคำตอบ</button>
                            ) : (
                                <button 
                                    onClick={() => { setCurrentIdx(Math.min(questions.length - 1, currentIdx + 1)); setShowHint(false); }}
                                    className="px-6 py-2 bg-white rounded-lg shadow hover:bg-gray-50 font-bold text-indigo-600"
                                >
                                    ข้อถัดไป
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ questions, answers, onHome, isCheated }) => {
            const score = questions.reduce((acc, q, i) => acc + (answers[i]?.ans === q.a ? 1 : 0), 0);
            const srs = useSRS();

            useEffect(() => {
                questions.forEach((q, i) => {
                    const ansData = answers[i];
                    if (ansData) {
                        const isCorrect = ansData.ans === q.a;
                        srs.update(q.id, isCorrect, ansData.time || 5000);
                    }
                });
            }, []);
            
            // Hard Reset Function
            const handleBackToHome = () => {
                onHome(); 
                // บังคับ Reload หน้าเว็บเพื่อให้ Memory สะอาดที่สุด แก้ปัญหาค้าง
                window.location.reload(); 
            };

            return (
                <div className="min-h-screen bg-indigo-50 p-6 flex justify-center">
                    <div className="bg-white w-full max-w-4xl rounded-3xl shadow-xl overflow-hidden flex flex-col">
                        <div className={`p-8 text-center text-white ${isCheated ? 'bg-red-600' : 'bg-indigo-600'}`}>
                            <h2 className="text-3xl font-bold mb-2">{isCheated ? 'ถูกปรับตก (ทุจริต)' : 'ผลการทดสอบ'}</h2>
                            <div className="text-6xl font-bold my-4">{Math.round(score/questions.length*100)}%</div>
                            <p>ทำได้ {score} จาก {questions.length} ข้อ</p>
                        </div>
                        <div className="p-6 text-center border-b">
                            <button onClick={handleBackToHome} className="px-8 py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition">กลับหน้าหลัก (Reset)</button>
                        </div>
                        <div className="p-6 bg-gray-50 flex-1 overflow-y-auto">
                            <h3 className="font-bold text-gray-700 mb-4">เฉลยละเอียด</h3>
                            <div className="space-y-4">
                                {questions.map((q, i) => {
                                    const myAns = answers[i]?.ans;
                                    const isCorrect = myAns === q.a;
                                    return (
                                        <div key={i} className={`p-4 rounded-xl border-l-4 bg-white shadow-sm ${isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                                            <div className="font-bold text-gray-800 mb-2">{i+1}. {q.q}</div>
                                            <div className="text-sm space-y-1 mb-3">
                                                <p className={isCorrect ? "text-green-600" : "text-red-600"}>
                                                    คุณตอบ: {myAns !== undefined ? q.opts[myAns] : 'ไม่ได้ตอบ'}
                                                </p>
                                                {!isCorrect && <p className="text-green-600 font-bold">เฉลย: {q.opts[q.a]}</p>}
                                            </div>
                                            <div className="bg-gray-100 p-3 rounded text-sm text-gray-600">{q.desc}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = useState('menu');
            const [mode, setMode] = useState('');
            const [activeQ, setActiveQ] = useState([]);
            const [result, setResult] = useState(null);

            const start = (selectedMode, param) => {
                setMode(selectedMode);
                let qSet = [];

                if (selectedMode === 'practice_all') {
                    qSet = [...QUESTION_POOL];
                } else if (selectedMode === 'practice_chapter') {
                    qSet = QUESTION_POOL.filter(q => q.ch === param);
                } else if (selectedMode === 'review_srs') {
                    const srs = JSON.parse(localStorage.getItem('gen1402_srs') || '{}');
                    const dueIds = Object.keys(srs).filter(id => srs[id].dueDate <= Date.now()).map(Number);
                    qSet = QUESTION_POOL.filter(q => dueIds.includes(q.id));
                } else if (selectedMode.includes('exam')) {
                    Object.keys(EXAM_BLUEPRINT).forEach(ch => {
                        const count = EXAM_BLUEPRINT[ch];
                        const pool = QUESTION_POOL.filter(q => q.ch == ch);
                        // ถ้าโจทย์ไม่พอก็เอามาหมด
                        const picked = pool.length > count ? pool.sort(() => 0.5 - Math.random()).slice(0, count) : pool;
                        qSet = [...qSet, ...picked];
                    });
                    
                    // เติมโจทย์ถ้าขาด (ใน Demo อาจมีไม่ครบ)
                    if (qSet.length < 50) { // ลดจำนวนขั้นต่ำลงเพื่อ Demo
                         const remaining = 50 - qSet.length;
                         const others = QUESTION_POOL.filter(q => !qSet.includes(q)).sort(() => 0.5 - Math.random()).slice(0, remaining);
                         qSet = [...qSet, ...others];
                    }
                }

                if (qSet.length === 0) {
                    Swal.fire('ไม่พบข้อสอบ', 'ไม่มีข้อสอบในหมวดนี้', 'info');
                    return;
                }

                setActiveQ(qSet);
                setPage('exam');
            };

            const finish = (answers, isCheated) => {
                setResult({ answers, isCheated });
                setPage('result');
            };

            return (
                <React.Fragment>
                    {page === 'menu' && <Menu onSelectMode={start} />}
                    {page === 'exam' && <Exam mode={mode} questions={activeQ} onFinish={finish} onQuit={() => setPage('menu')} />}
                    {page === 'result' && <Result questions={activeQ} answers={result.answers} isCheated={result.isCheated} onHome={() => setPage('menu')} />}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
