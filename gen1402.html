<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN1402 Exam Simulator (Anki Stats Edition)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .no-select { user-select: none; -webkit-user-select: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .anim-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stats Styles */
        .stat-card { @apply bg-white rounded-xl p-4 shadow-sm border border-gray-100; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==========================================
        // 1. DATA & CONFIG
        // ==========================================
        const EXAM_BLUEPRINT = { 5: 20, 6: 20, 7: 20, 8: 25, 9: 25 };
        
        // ตัวอย่างข้อสอบ (ย่อเพื่อประหยัดพื้นที่ - ของจริงใช้ชุดเดิมได้เลย)
        const QUESTION_POOL = [
            { id: 501, ch: 5, q: "ตามหลัก DIKW ข้อใดคือความหมายของ 'สารสนเทศ' (Information)?", opts: ["ข้อเท็จจริงดิบ", "ข้อมูลที่ผ่านการประมวลผลแล้ว", "ความเข้าใจหลักการ", "นวัตกรรม"], a: 1, desc: "สารสนเทศคือข้อมูลที่ผ่านการประมวลผล วิเคราะห์ หรือจัดหมวดหมู่แล้ว", hint: "ไม่ใช่ข้อมูลดิบ แต่ 'ปรุง' แล้ว" },
            { id: 502, ch: 5, q: "ทักษะ MIL ประกอบด้วย?", opts: ["รู้เท่าทันสื่อ + สารสนเทศ + ICT", "เขียนโปรแกรม + ซ่อมคอม", "อ่าน + เขียน + คิดเลข", "การตลาด + โฆษณา"], a: 0, desc: "UNESCO รวมทักษะสื่อ สารสนเทศ และเทคโนโลยีเข้าด้วยกัน", hint: "3 ห่วง: สื่อ, ข้อมูล, ไอที" },
            { id: 601, ch: 6, q: "Netiquette มาจาก?", opts: ["Net + Etiquette", "Network + Etiquette", "Internet + Etiquette", "New + Etiquette"], a: 1, desc: "Network + Etiquette", hint: "เครือข่าย + มารยาท" },
            { id: 701, ch: 7, q: "Office Syndrome เกิดจาก?", opts: ["กินไม่ตรงเวลา", "นั่งท่าเดิมนาน/สภาพแวดล้อมไม่ดี", "ไม่ออกกำลังกาย", "นอนดึก"], a: 1, desc: "การเกร็งกล้ามเนื้อมัดเดิมซ้ำๆ", hint: "นั่งแช่" },
            { id: 801, ch: 8, q: "Digital Transformation คือ?", opts: ["เปลี่ยนเว็บใหม่", "ปรับองค์กรขับเคลื่อนด้วยดิจิทัล", "เลิกจ้าง", "ขายออนไลน์"], a: 1, desc: "นำเทคโนโลยีมาเปลี่ยนกระบวนการทำงาน", hint: "แปลงร่างองค์กร" },
            { id: 901, ch: 9, q: "พ.ร.บ. คอมฯ ฉบับ 2 ประกาศ?", opts: ["1 ม.ค. 60", "24 ม.ค. 60", "1 เม.ย. 60", "31 ธ.ค. 60"], a: 1, desc: "ประกาศ 24 มกราคม 2560", hint: "เดือนมกรา" },
            // ... (สามารถใส่ข้อสอบเพิ่มเติมได้ตรงนี้) ...
        ];
        // จำลองข้อสอบให้ครบ 100+ ข้อสำหรับการทดสอบ
        const FULL_POOL = [...QUESTION_POOL];
        while (FULL_POOL.length < 120) {
            FULL_POOL.push({...QUESTION_POOL[Math.floor(Math.random()*QUESTION_POOL.length)], id: 1000 + FULL_POOL.length});
        }

        // ==========================================
        // 2. SRS SYSTEM (Updated for Stats)
        // ==========================================
        const useSRS = () => {
            const load = () => JSON.parse(localStorage.getItem('gen1402_srs_v2') || '{}');
            const save = (data) => localStorage.setItem('gen1402_srs_v2', JSON.stringify(data));
            
            const update = (qId, isCorrect, timeSpent) => {
                const db = load();
                let item = db[qId] || { 
                    ease: 2.5, 
                    interval: 0, 
                    reviews: 0, 
                    correct: 0, // New: เก็บจำนวนครั้งที่ถูก
                    lapses: 0   // New: เก็บจำนวนครั้งที่ผิดหลังจากจำได้แล้ว
                };
                
                const bonus = timeSpent < 5000 ? 0.15 : 0; // ตอบเร็วได้โบนัส

                if (!isCorrect) { 
                    item.interval = 0; // Reset -> Learning
                    item.ease = Math.max(1.3, item.ease - 0.2);
                    item.lapses++;
                } else {
                    item.correct++;
                    if (item.reviews === 0) item.interval = 1;
                    else if (item.reviews === 1) item.interval = 3;
                    else item.interval = Math.ceil(item.interval * (item.ease + bonus));
                    
                    item.ease += 0.1;
                }
                
                item.dueDate = Date.now() + (item.interval * 24 * 60 * 60 * 1000); // หน่วยเป็นวัน (ใช้จริง)
                // item.dueDate = Date.now() + (item.interval * 60000); // หน่วยเป็นนาที (สำหรับ Demo)
                
                item.reviews++;
                item.lastReview = Date.now();
                
                db[qId] = item;
                save(db);
            };

            const getStats = () => {
                const db = load();
                const totalCards = FULL_POOL.length; // ใช้จำนวนข้อสอบทั้งหมดเป็นฐาน
                const learnedCards = Object.keys(db).length;
                
                let mature = 0; // Interval > 21 days
                let young = 0;  // Interval <= 21 days
                let totalReviews = 0;
                let totalCorrect = 0;
                let forecast = [0, 0, 0, 0, 0]; // 5 days forecast

                const now = Date.now();
                const day = 24 * 60 * 60 * 1000;

                Object.values(db).forEach(item => {
                    if (item.interval > 21) mature++;
                    else young++;

                    totalReviews += item.reviews;
                    totalCorrect += item.correct;

                    // Forecast
                    const daysUntilDue = Math.ceil((item.dueDate - now) / day);
                    if (daysUntilDue >= 0 && daysUntilDue < 5) {
                        forecast[daysUntilDue]++;
                    }
                });

                return {
                    newCards: totalCards - learnedCards,
                    young,
                    mature,
                    retention: totalReviews === 0 ? 0 : Math.round((totalCorrect / totalReviews) * 100),
                    totalReviews,
                    forecast
                };
            };

            const getDue = () => {
                const db = load();
                const now = Date.now();
                return Object.keys(db).filter(id => db[id].dueDate <= now).map(Number);
            };

            return { update, getDue, getStats };
        };

        // ==========================================
        // 3. COMPONENTS
        // ==========================================

        // --- Stats Dashboard (Anki Style) ---
        const StatsDashboard = ({ stats, onReview, dueCount }) => {
            return (
                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border border-gray-100 w-full max-w-4xl mx-auto anim-fade">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                📊 สถิติการจำ (Spaced Repetition)
                            </h2>
                            <p className="text-gray-500 text-sm">วิเคราะห์ข้อมูลเหมือน Anki เพื่อการเรียนรู้ที่มีประสิทธิภาพ</p>
                        </div>
                        <div className="text-right">
                            <div className="text-3xl font-black font-inter text-indigo-600">{stats.retention}%</div>
                            <div className="text-xs text-gray-400 uppercase font-bold tracking-wide">Retention Rate</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        {/* 1. Card Types Breakdown */}
                        <div className="col-span-1 flex flex-col items-center justify-center p-4 bg-gray-50 rounded-2xl border border-gray-100">
                            <div className="relative w-40 h-40 mb-4">
                                {/* Simple CSS Pie Chart */}
                                <div className="w-full h-full rounded-full" 
                                     style={{
                                         background: `conic-gradient(
                                             #4ade80 0% ${stats.mature / (stats.newCards + stats.young + stats.mature) * 100}%, 
                                             #60a5fa 0% ${(stats.mature + stats.young) / (stats.newCards + stats.young + stats.mature) * 100}%, 
                                             #e2e8f0 0% 100%
                                         )`
                                     }}>
                                </div>
                                <div className="absolute inset-0 m-auto w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center">
                                    <span className="text-2xl font-bold text-gray-700">{stats.newCards + stats.young + stats.mature}</span>
                                    <span className="text-[10px] text-gray-400">TOTAL</span>
                                </div>
                            </div>
                            <div className="w-full space-y-2 text-sm">
                                <div className="flex justify-between items-center"><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-green-400"></span>Mature</span> <span className="font-bold">{stats.mature}</span></div>
                                <div className="flex justify-between items-center"><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-blue-400"></span>Young/Learn</span> <span className="font-bold">{stats.young}</span></div>
                                <div className="flex justify-between items-center"><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-gray-300"></span>New/Unseen</span> <span className="font-bold">{stats.newCards}</span></div>
                            </div>
                        </div>

                        {/* 2. Forecast Bar Chart */}
                        <div className="col-span-1 md:col-span-2 p-4 bg-white rounded-2xl border border-gray-100 flex flex-col">
                            <h3 className="text-sm font-bold text-gray-500 mb-4 uppercase tracking-wide">Forecast (ข้อที่ต้องทบทวนใน 5 วันหน้า)</h3>
                            <div className="flex items-end justify-between flex-1 h-32 gap-2 pb-2 border-b border-gray-200">
                                {stats.forecast.map((val, i) => {
                                    const maxVal = Math.max(...stats.forecast, 1);
                                    const height = (val / maxVal) * 100;
                                    return (
                                        <div key={i} className="flex-1 flex flex-col justify-end items-center group">
                                            <div className="text-xs font-bold text-gray-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity">{val}</div>
                                            <div className="w-full bg-indigo-100 rounded-t-md relative overflow-hidden transition-all hover:bg-indigo-300" style={{height: `${Math.max(height, 5)}%`}}>
                                                <div className="absolute bottom-0 w-full bg-indigo-500" style={{height: '4px'}}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                            <div className="flex justify-between text-xs text-gray-400 mt-2 font-mono">
                                <span>Today</span>
                                <span>+1d</span>
                                <span>+2d</span>
                                <span>+3d</span>
                                <span>+4d</span>
                            </div>
                        </div>
                    </div>

                    {/* Action Button */}
                    <div className="text-center">
                        {dueCount > 0 ? (
                            <button onClick={onReview} className="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white rounded-2xl font-bold shadow-lg shadow-green-200 transform transition hover:-translate-y-1 flex items-center justify-center gap-3 text-lg">
                                <span>📖 เริ่มทบทวน</span>
                                <span className="bg-white/20 px-2 py-0.5 rounded-lg text-sm">{dueCount} ข้อ</span>
                            </button>
                        ) : (
                            <div className="p-4 bg-gray-100 rounded-2xl text-gray-500 font-medium border border-gray-200">
                                🎉 เยี่ยมมาก! คุณทบทวนครบทุกข้อสำหรับวันนี้แล้ว
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Menu = ({ onSelectMode }) => {
            const srs = useSRS();
            const dueCount = srs.getDue().length;
            const stats = srs.getStats();
            const [showStats, setShowStats] = useState(false);

            if (showStats) {
                return (
                    <div className="min-h-screen bg-gray-50 p-4 flex flex-col items-center justify-center">
                        <StatsDashboard stats={stats} dueCount={dueCount} onReview={() => onSelectMode('review_srs')} />
                        <button onClick={() => setShowStats(false)} className="mt-6 text-gray-500 hover:text-indigo-600 font-bold">
                            ✕ ปิดหน้าต่างสถิติ
                        </button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-900 to-indigo-900 text-white relative overflow-hidden">
                    {/* Background Elements */}
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0 opacity-20">
                        <div className="absolute top-10 left-10 w-64 h-64 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl animate-blob"></div>
                        <div className="absolute top-10 right-10 w-64 h-64 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl animate-blob animation-delay-2000"></div>
                        <div className="absolute -bottom-8 left-20 w-64 h-64 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl animate-blob animation-delay-4000"></div>
                    </div>

                    <div className="max-w-5xl w-full z-10">
                        <div className="text-center mb-10">
                            <h1 className="text-5xl font-black mb-2 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-purple-200">GEN1402</h1>
                            <p className="text-indigo-200 text-lg">Exam Simulator Ultimate V3.0</p>
                        </div>

                        <div className="grid md:grid-cols-3 gap-6">
                            {/* Practice Mode */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 hover:bg-white/15 transition group cursor-pointer" onClick={() => onSelectMode('practice_all')}>
                                <div className="w-14 h-14 bg-blue-500/20 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition text-blue-300">📚</div>
                                <h3 className="text-xl font-bold mb-1">โหมดฝึกฝน</h3>
                                <p className="text-sm text-indigo-200 mb-6">ตะลุยโจทย์พร้อมเฉลย</p>
                                <div className="grid grid-cols-5 gap-1">
                                    {[5,6,7,8,9].map(c => (
                                        <button key={c} onClick={(e) => { e.stopPropagation(); onSelectMode('practice_chapter', c); }} className="py-1 bg-white/10 hover:bg-white/30 rounded text-xs font-bold transition">บท {c}</button>
                                    ))}
                                </div>
                            </div>

                            {/* SRS Review Mode (Highlighted) */}
                            <div className="bg-gradient-to-b from-emerald-500/20 to-teal-900/40 backdrop-blur-md border border-emerald-500/30 rounded-3xl p-6 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 p-4 opacity-50 group-hover:opacity-100 transition"><span className="text-4xl">🧠</span></div>
                                <h3 className="text-xl font-bold mb-1 text-emerald-100">ระบบทบทวน (SRS)</h3>
                                <p className="text-sm text-emerald-200/70 mb-4">จำแม่นด้วย Spaced Repetition</p>
                                
                                <div className="flex items-end gap-2 mb-4">
                                    <div className="text-4xl font-bold text-white">{dueCount}</div>
                                    <div className="text-sm text-emerald-200 mb-1">ข้อที่ต้องทำวันนี้</div>
                                </div>

                                <div className="space-y-2">
                                    <button onClick={() => setShowStats(true)} className="w-full py-2 bg-emerald-800/50 hover:bg-emerald-700/50 border border-emerald-500/30 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                                        📊 ดูสถิติละเอียด (Anki Stats)
                                    </button>
                                    <button onClick={() => dueCount > 0 ? onSelectMode('review_srs') : null} disabled={dueCount === 0} className={`w-full py-2 rounded-xl text-sm font-bold shadow-lg transition ${dueCount > 0 ? 'bg-emerald-500 hover:bg-emerald-400 text-white cursor-pointer' : 'bg-gray-600/50 text-gray-400 cursor-not-allowed'}`}>
                                        {dueCount > 0 ? 'เริ่มทบทวนเลย' : 'ไม่มีข้อค้างชำระ'}
                                    </button>
                                </div>
                            </div>

                            {/* Exam Mode */}
                            <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-6 hover:bg-white/15 transition group">
                                <div className="w-14 h-14 bg-red-500/20 rounded-2xl flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition text-red-300">⏰</div>
                                <h3 className="text-xl font-bold mb-1">สอบเสมือนจริง</h3>
                                <p className="text-sm text-indigo-200 mb-6">จับเวลา 90 นาที / 110 ข้อ</p>
                                <div className="space-y-2">
                                    <button onClick={() => onSelectMode('exam_normal')} className="w-full py-2 bg-red-600 hover:bg-red-500 rounded-xl text-sm font-bold transition shadow-lg">สอบปกติ</button>
                                    <button onClick={() => onSelectMode('exam_serious')} className="w-full py-2 bg-gray-800 hover:bg-gray-900 border border-gray-600 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                                        <span>🛡️ สอบจริงจัง (Anti-Cheat)</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Exam = ({ mode, questions, onFinish, onQuit }) => {
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(mode.includes('exam') ? 90 * 60 : null);
            const [showHint, setShowHint] = useState(false);
            
            // Security Vars
            const [warningCount, setWarningCount] = useState(0);
            const lastActive = useRef(Date.now());
            const isMonitoring = useRef(false);
            const isCheckingAFK = useRef(false);

            const isPractice = mode.includes('practice') || mode === 'review_srs';
            const isSerious = mode === 'exam_serious';

            useEffect(() => {
                let timer;
                if (timeLeft !== null) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) { clearInterval(timer); finish(); return 0; }
                            return prev - 1;
                        });
                    }, 1000);
                }

                if (isSerious) {
                    setTimeout(() => {
                        isMonitoring.current = true;
                        lastActive.current = Date.now();
                        console.log("Security Armed");
                    }, 3000);
                }

                return () => clearInterval(timer);
            }, []);

            // Security Logic (Same as V2.1 Fixed)
            useEffect(() => {
                if (!isSerious) return;

                const triggerWarning = (msg) => {
                    if (!isMonitoring.current || isCheckingAFK.current) return;
                    isMonitoring.current = false;
                    
                    const newCount = warningCount + 1;
                    setWarningCount(newCount);

                    Swal.fire({
                        icon: 'warning',
                        title: 'ผิดกฎการสอบ!',
                        text: `${msg} (เตือนครั้งที่ ${newCount}/3)`,
                        confirmButtonText: 'รับทราบ',
                        allowOutsideClick: false
                    }).then(() => {
                        if (newCount >= 3) finish(true);
                        else {
                            isMonitoring.current = true;
                            lastActive.current = Date.now();
                        }
                    });
                };

                const handleVisibility = () => { if (document.hidden) triggerWarning("ห้ามพับหน้าจอหรือสลับแท็บ!"); };
                const handleBlur = () => { triggerWarning("กรุณาอย่าคลิกนอกหน้าต่างสอบ!"); };
                
                const checkAFKInterval = setInterval(() => {
                    if (!isMonitoring.current || isCheckingAFK.current) return;
                    if (Date.now() - lastActive.current > 45000) { // 45s AFK Warning
                        isCheckingAFK.current = true;
                        let timerInterval;
                        Swal.fire({
                            title: 'ยังอยู่ไหม?',
                            html: 'ระบบจะปรับตกใน <b></b> วินาที',
                            timer: 10000,
                            timerProgressBar: true,
                            showConfirmButton: true,
                            confirmButtonText: 'ยังอยู่!',
                            didOpen: () => {
                                const b = Swal.getHtmlContainer().querySelector('b');
                                timerInterval = setInterval(() => { if(b) b.textContent = Math.ceil(Swal.getTimerLeft() / 1000); }, 100);
                            },
                            willClose: () => clearInterval(timerInterval)
                        }).then((result) => {
                            isCheckingAFK.current = false;
                            if (result.dismiss === Swal.DismissReason.timer) {
                                isMonitoring.current = true;
                                triggerWarning("ไม่มีการตอบสนองนานเกินไป (AFK)");
                            } else {
                                lastActive.current = Date.now();
                            }
                        });
                    }
                }, 1000);

                const resetActivity = () => { if (!isCheckingAFK.current) lastActive.current = Date.now(); };

                window.addEventListener('blur', handleBlur);
                document.addEventListener('visibilitychange', handleVisibility);
                window.addEventListener('mousemove', resetActivity);
                window.addEventListener('keydown', resetActivity);
                window.addEventListener('click', resetActivity);

                return () => {
                    window.removeEventListener('blur', handleBlur);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    window.removeEventListener('mousemove', resetActivity);
                    window.removeEventListener('keydown', resetActivity);
                    window.removeEventListener('click', resetActivity);
                    clearInterval(checkAFKInterval);
                };
            }, [isSerious, warningCount]);

            const handleAnswer = (optIdx) => {
                const timeSpent = Date.now() - lastActive.current;
                setAnswers(prev => ({ ...prev, [currentIdx]: { ans: optIdx, time: timeSpent } }));
                lastActive.current = Date.now();
            };

            const finish = (force = false) => {
                isMonitoring.current = false;
                if (force) onFinish(answers, true);
                else {
                    Swal.fire({
                        title: 'ยืนยันส่งคำตอบ?',
                        text: `ทำไปแล้ว ${Object.keys(answers).length} / ${questions.length} ข้อ`,
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: 'ส่งเลย',
                        cancelButtonText: 'ทำต่อ'
                    }).then((result) => {
                        if (result.isConfirmed) onFinish(answers, false);
                    });
                }
            };

            const q = questions[currentIdx];
            const answered = answers[currentIdx];

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-inter">
                    <div className="bg-white shadow-md sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                            <button onClick={onQuit} className="text-gray-500 hover:text-red-600 font-bold">Exit</button>
                            <div className="font-bold text-lg flex flex-col items-center">
                                <span>{isSerious ? '🛡️ Proctored Exam' : isPractice ? 'Practice Mode' : 'Normal Exam'}</span>
                                {isSerious && <span className="text-xs text-red-500">Warning: {warningCount}/3</span>}
                            </div>
                            {timeLeft !== null && (
                                <div className={`font-mono text-xl font-bold ${timeLeft < 300 ? 'text-red-500 animate-pulse' : 'text-indigo-600'}`}>
                                    {Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}
                                </div>
                            )}
                        </div>
                        <div className="h-1 bg-gray-200 w-full">
                            <div className="h-full bg-green-500 transition-all duration-300" style={{ width: `${((currentIdx+1)/questions.length)*100}%` }}></div>
                        </div>
                    </div>

                    <div className="flex-1 max-w-3xl w-full mx-auto p-4 md:p-8">
                        <div className="bg-white rounded-3xl shadow-sm border border-gray-200 p-6 md:p-10 anim-fade">
                            <div className="flex justify-between items-start mb-6">
                                <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider">Question {currentIdx + 1} / {questions.length}</span>
                                <span className="text-xs text-gray-400 font-bold uppercase">Chapter {q.ch}</span>
                            </div>

                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-8 leading-relaxed font-sarabun">{q.q}</h2>

                            <div className="space-y-3 font-sarabun">
                                {q.opts.map((opt, i) => {
                                    let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all font-medium ";
                                    if (isPractice && answered) {
                                        if (i === q.a) btnClass += "bg-green-100 border-green-500 text-green-900";
                                        else if (i === answered.ans) btnClass += "bg-red-100 border-red-500 text-red-900";
                                        else btnClass += "border-gray-100 text-gray-400 opacity-50";
                                    } else if (answered?.ans === i) {
                                        btnClass += "bg-indigo-100 border-indigo-500 text-indigo-900";
                                    } else {
                                        btnClass += "border-gray-100 hover:border-indigo-200 hover:bg-gray-50 text-gray-600";
                                    }

                                    return (
                                        <button 
                                            key={i} 
                                            onClick={() => !answered && handleAnswer(i)} 
                                            disabled={isPractice && answered}
                                            className={btnClass}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>

                            {isPractice && (
                                <div className="mt-6 space-y-4 font-sarabun">
                                    {!answered && (
                                        <button onClick={() => setShowHint(!showHint)} className="text-orange-500 text-sm font-bold hover:underline flex items-center gap-1">
                                            <span>💡</span> {showHint ? 'ซ่อนคำใบ้' : 'ดูคำใบ้'}
                                        </button>
                                    )}
                                    {showHint && !answered && (
                                        <div className="bg-orange-50 p-3 rounded-lg text-orange-800 text-sm border-l-4 border-orange-400 anim-fade">
                                            {q.hint}
                                        </div>
                                    )}
                                    {answered && (
                                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-100 anim-fade">
                                            <h4 className="font-bold text-blue-900 mb-1">คำอธิบาย:</h4>
                                            <p className="text-blue-800 text-sm">{q.desc}</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="flex justify-between mt-6">
                            <button 
                                onClick={() => { setCurrentIdx(Math.max(0, currentIdx - 1)); setShowHint(false); }}
                                disabled={currentIdx === 0}
                                className="px-6 py-2 bg-white rounded-lg shadow disabled:opacity-50 font-bold text-gray-600 hover:bg-gray-50"
                            >
                                ← Prev
                            </button>
                            {currentIdx === questions.length - 1 ? (
                                <button onClick={() => finish()} className="px-6 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 font-bold">Finish</button>
                            ) : (
                                <button 
                                    onClick={() => { setCurrentIdx(Math.min(questions.length - 1, currentIdx + 1)); setShowHint(false); }}
                                    className="px-6 py-2 bg-white rounded-lg shadow hover:bg-gray-50 font-bold text-indigo-600"
                                >
                                    Next →
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const Result = ({ questions, answers, onHome, isCheated }) => {
            const score = questions.reduce((acc, q, i) => acc + (answers[i]?.ans === q.a ? 1 : 0), 0);
            const srs = useSRS();

            useEffect(() => {
                questions.forEach((q, i) => {
                    const ansData = answers[i];
                    if (ansData) {
                        const isCorrect = ansData.ans === q.a;
                        srs.update(q.id, isCorrect, ansData.time || 5000);
                    }
                });
            }, []);
            
            const handleBack = () => {
                onHome();
                window.location.reload(); // Hard Reset
            };

            return (
                <div className="min-h-screen bg-indigo-50 p-6 flex justify-center font-sarabun">
                    <div className="bg-white w-full max-w-4xl rounded-3xl shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className={`p-8 text-center text-white ${isCheated ? 'bg-red-600' : 'bg-indigo-600'}`}>
                            <h2 className="text-3xl font-bold mb-2">{isCheated ? 'ถูกปรับตก (ทุจริต)' : 'ผลการทดสอบ'}</h2>
                            <div className="text-6xl font-black my-4 font-inter">{Math.round(score/questions.length*100)}%</div>
                            <p className="opacity-90">ทำได้ {score} จาก {questions.length} ข้อ</p>
                        </div>
                        <div className="p-4 text-center border-b bg-gray-50">
                            <button onClick={handleBack} className="px-8 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg font-bold hover:bg-gray-100 transition shadow-sm">
                                กลับหน้าหลัก
                            </button>
                        </div>
                        <div className="p-6 bg-white flex-1 overflow-y-auto">
                            <div className="space-y-4">
                                {questions.map((q, i) => {
                                    const myAns = answers[i]?.ans;
                                    const isCorrect = myAns === q.a;
                                    return (
                                        <div key={i} className={`p-4 rounded-xl border-l-4 bg-white shadow-sm border border-gray-100 ${isCorrect ? 'border-l-green-500' : 'border-l-red-500'}`}>
                                            <div className="font-bold text-gray-800 mb-2">{i+1}. {q.q}</div>
                                            <div className="text-sm space-y-1 mb-3">
                                                <p className={isCorrect ? "text-green-600 font-bold" : "text-red-500"}>
                                                    คุณตอบ: {myAns !== undefined ? q.opts[myAns] : 'ไม่ได้ตอบ'}
                                                </p>
                                                {!isCorrect && <p className="text-green-600 font-bold">เฉลย: {q.opts[q.a]}</p>}
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded text-sm text-gray-600">{q.desc}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = useState('menu');
            const [mode, setMode] = useState('');
            const [activeQ, setActiveQ] = useState([]);
            const [result, setResult] = useState(null);

            const start = (selectedMode, param) => {
                setMode(selectedMode);
                let qSet = [];

                if (selectedMode === 'practice_all') {
                    qSet = [...FULL_POOL];
                } else if (selectedMode === 'practice_chapter') {
                    qSet = FULL_POOL.filter(q => q.ch === param);
                } else if (selectedMode === 'review_srs') {
                    const srs = JSON.parse(localStorage.getItem('gen1402_srs_v2') || '{}');
                    const dueIds = Object.keys(srs).filter(id => srs[id].dueDate <= Date.now()).map(Number);
                    qSet = FULL_POOL.filter(q => dueIds.includes(q.id));
                } else if (selectedMode.includes('exam')) {
                    Object.keys(EXAM_BLUEPRINT).forEach(ch => {
                        const count = EXAM_BLUEPRINT[ch];
                        const pool = FULL_POOL.filter(q => q.ch == ch);
                        const picked = pool.length > count ? pool.sort(() => 0.5 - Math.random()).slice(0, count) : pool;
                        qSet = [...qSet, ...picked];
                    });
                    
                    // Fill remaining if needed
                    while (qSet.length < 110 && FULL_POOL.length > 110) {
                        const random = FULL_POOL[Math.floor(Math.random()*FULL_POOL.length)];
                        if (!qSet.includes(random)) qSet.push(random);
                    }
                }

                if (qSet.length === 0) {
                    Swal.fire('ไม่พบข้อสอบ', 'ไม่มีข้อสอบในหมวดนี้ หรือยังไม่ถึงกำหนดทบทวน', 'info');
                    return;
                }

                setActiveQ(qSet);
                setPage('exam');
            };

            const finish = (answers, isCheated) => {
                setResult({ answers, isCheated });
                setPage('result');
            };

            return (
                <React.Fragment>
                    {page === 'menu' && <Menu onSelectMode={start} />}
                    {page === 'exam' && <Exam mode={mode} questions={activeQ} onFinish={finish} onQuit={() => setPage('menu')} />}
                    {page === 'result' && <Result questions={activeQ} answers={result.answers} isCheated={result.isCheated} onHome={() => setPage('menu')} />}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
